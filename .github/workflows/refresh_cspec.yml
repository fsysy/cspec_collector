name: Refresh CSpec data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: python -m cspec_collector all --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cspec-output
          path: |
            data/normalized/
            kb/
            reports/
      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: cspec-data-update
          delete-branch: true
          title: "chore: refresh ClinGen CSpec data"
          body: |
            Automated weekly CSpec refresh. Review validation_report.md and change_report.md before merging.
          commit-message: "chore: refresh ClinGen CSpec data"
          add-paths: |
            data/normalized/**
            kb/**
            reports/validation_report.md
            reports/change_report.md

