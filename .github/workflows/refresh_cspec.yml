name: Refresh CSpec data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev
      - run: uv run pytest
      - run: uv run python -m cspec_collector all --resume
      - name: Build standalone rule records
        run: >-
          uv run python transform_cspec.py
          --input data/normalized/cspec_documents.jsonl
          --criteria-input data/normalized/cspec_criteria.jsonl
          --index-output data/transformed/cspec_document_index.jsonl
          --rules-output data/transformed/cspec_rules.jsonl
          --report-output data/transformed/cspec_validation_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cspec-output
          path: |
            data/normalized/
            kb/
            reports/
            data/transformed/
      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: cspec-data-update
          delete-branch: true
          title: "chore: refresh ClinGen CSpec data"
          body: |
            Automated weekly CSpec refresh. Review validation_report.md and change_report.md before merging.
          commit-message: "chore: refresh ClinGen CSpec data"
          add-paths: |
            data/normalized/**
            kb/**
            reports/validation_report.md
            reports/change_report.md
            data/transformed/**

