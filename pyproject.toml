[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cspec-collector"
version = "0.1.0"
description = "Collect and normalize ClinGen CSpec Registry criteria specifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "typer>=0.12,<1", "truststore>=0.10,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cspec-collector = "cspec_collector.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cspec_collector", "cspec_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/cspec_collector/cli.py" = ["B008"]
"src/cspec_collector/pipeline.py" = ["BLE001"]
